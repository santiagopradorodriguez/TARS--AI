name: Build TARS Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Android Oficial Firmado
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9677f2b2 # v4.3.1

      - name: Decodificar Keystore Persistente y Compilar APK Release Firmado
        env:
          TARS_KEYSTORE_BASE64: ${{ secrets.TARS_KEYSTORE_BASE64 }}
          TARS_KEYSTORE_PASSWORD: ${{ secrets.TARS_KEYSTORE_PASSWORD }}
          TARS_KEY_ALIAS: ${{ secrets.TARS_KEY_ALIAS }}
          TARS_KEY_PASSWORD: ${{ secrets.TARS_KEY_PASSWORD }}
          TARS_KEYSTORE_PATH: ${{ github.workspace }}/android/tars.keystore
        run: |
          if [ -z "$TARS_KEYSTORE_BASE64" ] || [ -z "$TARS_KEYSTORE_PASSWORD" ] || [ -z "$TARS_KEY_PASSWORD" ]; then
            echo "Aviso: GitHub Secrets no configurados; generando keystore temporal para esta compilacion."
            export TARS_KEYSTORE_PASSWORD="${TARS_KEYSTORE_PASSWORD:-tars_ephemeral_pass}"
            export TARS_KEY_ALIAS="${TARS_KEY_ALIAS:-tars}"
            export TARS_KEY_PASSWORD="${TARS_KEY_PASSWORD:-tars_ephemeral_pass}"
            keytool -genkey -v -keystore "$TARS_KEYSTORE_PATH" -alias "$TARS_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$TARS_KEYSTORE_PASSWORD" -keypass "$TARS_KEY_PASSWORD" -dname "CN=TARS, OU=AI, O=TARS, L=BA, S=BA, C=AR"
          else
            echo "$TARS_KEYSTORE_BASE64" | base64 -d > "$TARS_KEYSTORE_PATH"
          fi
          chmod 600 "$TARS_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          rm -f "$TARS_KEYSTORE_PATH"

      - name: Renombrar APK para descarga directa
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/TARS-Assistant.apk

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TARS-Assistant-APK
          path: build_output/TARS-Assistant.apk
          retention-days: 14

      - name: Publicar Release directa para celular
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa1b2ef267ace # v2.2.1
        with:
          tag_name: v1.2.1
          name: TARS Android v1.2.1 - Release Firmado
          draft: false
          prerelease: false
          files: build_output/TARS-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
