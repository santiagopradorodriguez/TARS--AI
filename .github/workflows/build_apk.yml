name: Build TARS Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android Oficial Firmado
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Keystore y Compilar APK Release Firmado
        run: |
          cd android
          keytool -genkey -v -keystore tars.keystore -alias tars -keyalg RSA -keysize 2048 -validity 10000 -storepass tars123456 -keypass tars123456 -dname "CN=TARS, OU=AI, O=TARS, L=BA, S=BA, C=AR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK para descarga directa
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/TARS-Assistant.apk

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Assistant-APK
          path: build_output/TARS-Assistant.apk
          retention-days: 14

      - name: Publicar Release directa para celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: TARS Android v1.0.1 - Release Firmado
          draft: false
          prerelease: false
          files: build_output/TARS-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
