<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARS Movil</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <span class="status-indicator online"></span>
                <h1>TARS</h1>
            </div>
            <div class="connection-info">
                <span id="connection-status">En linea</span>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <div class="message assistant">
                <div class="message-content">
                    <p>Sistemas en linea. Puedes hablarme presionando el boton de microfono o escribir tu solicitud.</p>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="input-bar">
                <input type="text" id="text-input" placeholder="Escribe un comando o consulta..." autocomplete="off">
                <button id="send-btn" class="icon-btn" title="Enviar mensaje">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>

            <div class="mic-controls">
                <button id="mic-btn" class="mic-button" title="Presiona para hablar">
                    <div class="pulse-ring"></div>
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <span id="mic-status-label" class="mic-status">Toca para hablar</span>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
