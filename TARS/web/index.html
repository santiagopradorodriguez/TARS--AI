<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f1117">
    <title>TARS Movil</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <span class="status-indicator online"></span>
                <h1>TARS</h1>
            </div>
            <div class="connection-info">
                <button id="chat-selector-btn" class="chat-selector-btn" title="Chats de Antigravity">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                    </svg>
                    <span id="current-chat-title" class="current-chat-title">Chat activo</span>
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" class="chevron-icon">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div id="audio-control-bar" class="audio-control-bar hidden">
            <div class="audio-info">
                <span class="audio-pulse-dot"></span>
                <span id="audio-status-text">Elena hablando...</span>
            </div>
            <div class="audio-actions">
                <button id="audio-pause-btn" class="audio-ctrl-btn" title="Pausar / Reanudar">
                    <svg id="pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                    <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button id="audio-stop-btn" class="audio-ctrl-btn stop" title="Detener voz">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M6 6h12v12H6z"/>
                    </svg>
                </button>
            </div>
        </div>

        <main class="chat-container" id="chat-container">
            <div class="message assistant">
                <div class="message-content">
                    <p>Sistemas en linea. Puedes hablarme presionando el boton de microfono o escribir tu solicitud.</p>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="input-bar">
                <input type="text" id="text-input" placeholder="Escribe un comando o consulta..." autocomplete="off">
                <button id="send-btn" class="icon-btn" title="Enviar mensaje">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>

            <div class="mic-controls">
                <button id="mic-btn" class="mic-button" title="Presiona para hablar">
                    <div class="pulse-ring"></div>
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <span id="mic-status-label" class="mic-status">Toca para hablar</span>
            </div>
        </footer>
    </div>

    <!-- Modal selector de chats de Antigravity -->
    <div id="chats-modal" class="chats-modal hidden">
        <div class="chats-modal-overlay" id="chats-modal-overlay"></div>
        <div class="chats-modal-card">
            <div class="chats-modal-header">
                <div class="modal-title-group">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                    </svg>
                    <h3>Chats de Antigravity</h3>
                </div>
                <button id="chats-modal-close" class="modal-close-btn" title="Cerrar">&times;</button>
            </div>
            <div class="chats-modal-quick-nav">
                <button id="prev-chat-btn" class="quick-nav-btn" title="Ir al chat anterior">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    Anterior
                </button>
                <button id="next-chat-btn" class="quick-nav-btn" title="Ir al chat siguiente">
                    Siguiente
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>
            <div class="chats-list-container" id="chats-list">
                <div class="loading-chats">Buscando chats abiertos...</div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
